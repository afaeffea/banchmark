# Реестр моделей для бенчмарка tool-calling.
# Файл редактируется из веб-панели (webui), можно править и вручную.
# base_url — любой OpenAI-совместимый эндпоинт: прямой API вендора или шлюз-роутер.
# rate_limit — общий на весь прогон: при работе через роутер лимит считается по ключу.

rate_limit:
  requests_per_minute: 9
  max_retries: 4
models:
- id: deepseek
  display_name: DeepSeek V4.1
  model: deepseek/deepseek-v4.1-flash
  base_url: https://api.tokenrouter.com/v1
  api_key_env: TOKENROUTER_API_KEY
